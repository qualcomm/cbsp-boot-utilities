[build-system]
requires = ["poetry-core>=1.5"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "qcom-capsule-tool"
version = "1.0.0"
description = "Qualcomm capsule generation tools for UEFI firmware updates"
license = "BSD-3-Clause-Clear"
authors = ["Qualcomm Innovation Center <noreply@qualcomm.com>"]
packages = [{ include = "qcom_capsule_tool", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
pyelftools = "*"
pylibfdt = "*"

# pylibfdt ships only an sdist (no prebuilt wheels), so its SWIG-generated
# _libfdt C extension is compiled from source on every install. Its
# libfdt.i still uses the Python 2 compatibility macro PyInt_AsLong, which
# SWIG dropped in 4.5.0, breaking the import with
# "undefined symbol: PyInt_AsLong". Pin the build-time swig dependency
# below that release until an upstream pylibfdt fix is published.
[tool.poetry.build-constraints]
pylibfdt = { swig = "<4.5.0" }

[tool.poetry.group.dev.dependencies]
ruff = "0.15.16"
mypy = "1.19.1"
pytest = "^8.0"

[tool.poetry.scripts]
qcom-capsule-tool = "qcom_capsule_tool.cli:main"

[tool.mypy]
python_version = "3.9"

# Third-party deps without type stubs or py.typed markers. Silence
# mypy's import-untyped error rather than wrapping each call site.
[[tool.mypy.overrides]]
module = ["libfdt", "elftools.*"]
ignore_missing_imports = true
